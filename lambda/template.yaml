AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AR Interior Engine — AWS Backend (API Gateway + Lambda + DynamoDB)

Globals:
  Function:
    Timeout: 30
    Runtime: python3.13
    MemorySize: 256
    Environment:
      Variables:
        AWS_REGION_NAME: !Ref AWS::Region
        CATALOG_TABLE: !Ref FurnitureCatalogTable
        MODEL_BUCKET: !Ref ModelBucket
        BEDROCK_MODEL_ID: anthropic.claude-3-haiku-20240307-v1:0

  Api:
    Cors:
      AllowOrigin: "'*'"
      AllowHeaders: "'Content-Type,X-Api-Key'"
      AllowMethods: "'POST,OPTIONS'"

Resources:
  # ─── API Gateway ────────────────────────────────────────────
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: ARInteriorAPI
      StageName: prod

  # ─── Lambda Functions ──────────────────────────────────────
  IntentExtractorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ar-interior-intent-extractor
      CodeUri: intent_extractor/
      Handler: handler.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
      Events:
        IntentApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /intent
            Method: post

  VoiceCommandParserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ar-interior-voice-parser
      CodeUri: voice_command_parser/
      Handler: handler.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
      Events:
        VoiceCmdApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /voice-cmd
            Method: post

  ObjectLabelerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ar-interior-object-labeler
      CodeUri: object_labeler/
      Handler: handler.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - rekognition:DetectLabels
              Resource: "*"
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
              Resource: !GetAtt FurnitureCatalogTable.Arn
      Events:
        LabelApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /label
            Method: post

  # ─── DynamoDB ───────────────────────────────────────────────
  FurnitureCatalogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: FurnitureCatalog
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: category
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: category
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE

  # ─── S3 Bucket (public read for models) ────────────────────
  ModelBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ar-interior-models-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  ModelBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ModelBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub ${ModelBucket.Arn}/*

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod

  ModelBucketName:
    Description: S3 bucket for 3D models
    Value: !Ref ModelBucket

  CatalogTableName:
    Description: DynamoDB table name
    Value: !Ref FurnitureCatalogTable
